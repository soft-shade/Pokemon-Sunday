# Build the macOS launcher on GitHub's Mac runners.
#
# This lives in the public release repository because macOS runners are free
# there and billed at ten times the normal rate on a private one - an mkxp-z
# build is long enough that the difference is the whole free allowance.
#
# Canonical copy is tools/macos-release.yml in the dev repo; the release build
# installs it here, so edit it there.
#
# Run it from the Actions tab, or:
#   gh workflow run macos-release.yml --repo soft-shade/Pokemon-Sunday
name: macOS launcher

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "mkxp-z commit to build"
        default: "c9378cfaba06e0b299a1bfd4197f62da018693da"
      runner:
        description: "Runner image (try macos-14 if latest fails)"
        default: "macos-latest"
      publish:
        description: "Commit the launcher into the repo (false to only upload)"
        default: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build and bundle
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}
    timeout-minutes: 180

    steps:
      # The game itself. This repo is the play tree, so a plain checkout is
      # exactly what belongs inside the bundle.
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: game
          # On a branch, not the detached HEAD checkout defaults to: the
          # launcher is committed back here and a detached HEAD has nowhere
          # to push to.
          ref: ${{ github.ref_name }}

      # Pinned, not the default branch. dev is hundreds of commits ahead and
      # its hi-res "mega surface" work renders every line of text in the game
      # as its top half only - the title screen looks perfect and every menu is
      # unreadable. Essentials names the commit it expects on startup.
      - name: Check out mkxp-z at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: mkxp-z/mkxp-z
          ref: ${{ github.event.inputs.engine_ref || 'c9378cfaba06e0b299a1bfd4197f62da018693da' }}
          path: engine

      # The runner ships a large brew set whose headers get picked up ahead of
      # the ones the dependency build makes. Upstream's own workflow clears it.
      - name: Clear pre-installed homebrew packages
        run: brew remove --force $(brew list) || true

      - name: Cache the dependency build
        uses: actions/cache@v4
        with:
          path: |
            engine/macos/Dependencies/build-macosx-x86_64
            engine/macos/Dependencies/build-macosx-arm64
            engine/macos/Dependencies/build-macosx-universal
            engine/macos/Dependencies/downloads
          key: mkxpz-${{ inputs.engine_ref }}-${{ hashFiles('engine/macos/Dependencies/*.make', 'engine/macos/Dependencies/*.sh') }}

      - name: Install homebrew tools
        working-directory: engine/macos/Dependencies
        run: brew bundle

      # Three separate ways a 2013 codebase meets a 2026 toolchain, all
      # handled by putting a shim ahead of the compiler on PATH:
      #
      #  * -force_cpusubtype_ALL: libvorbis has passed it since the PowerPC
      #    days and Apple's linker no longer knows it. Dropped.
      #  * warnings clang 16 promoted to errors by default. Put back to
      #    warnings - this is the severity all of these libraries were written,
      #    tested and shipped against, and the alternative is patching Ruby.
      #  * clang 21 defaults to -std=gnu23, and C23 removed declarations
      #    without prototypes. Ruby 3.1's dln.c and error.c still use them, so
      #    C compiles are pinned to gnu17 unless the build asked for a standard
      #    itself. Only the C shims do this: -std=gnu17 is not valid for C++.
      #
      # Written with quoted echoes rather than a heredoc: a heredoc inside a
      # shell function produced an empty file here, and an empty but executable
      # "clang" fails as "C compiler cannot create executables", which points
      # nowhere near the cause. The self-test is so a broken shim says so here
      # rather than being diagnosed twice, three steps later.
      - name: Shim the compiler for a 2013 codebase
        run: |
          mkdir -p "$HOME/shim"
          # /usr/bin/clang, not the toolchain binary xcrun -f reports: the
          # former resolves the SDK, the latter does not and linking then fails
          # with "library 'System' not found".
          for spec in "clang:/usr/bin/clang:c" "cc:/usr/bin/clang:c"                       "clang++:/usr/bin/clang++:cxx" "c++:/usr/bin/clang++:cxx"; do
            name="${spec%%:*}"; rest="${spec#*:}"
            real="${rest%%:*}"; lang="${rest#*:}"
            {
              echo '#!/bin/bash'
              echo 'args=()'
              echo 'compiling=0'
              echo 'has_src=0'
              echo 'has_std=0'
              echo 'for a in "$@"; do'
              echo '  [ "$a" = "-force_cpusubtype_ALL" ] && continue'
              echo '  [ "$a" = "-c" ] && compiling=1'
              echo '  # mkmf compiles and links in one command, with no -c, so'
              echo '  # keying off -c alone left its probes on the C23 default'
              echo '  # and every one of them failed against ruby.h. Any source'
              echo '  # file on the line means this is a compile.'
              echo '  case "$a" in *.c|*.m|*.mm|*.cc|*.cpp|*.cxx) has_src=1;; esac'
              echo '  # A build that asked for C23 did not mean to: configure'
              echo '  # probes the compiler and records whatever it defaults to.'
              echo '  # Rewrite C23 only - a deliberate -std=c99 is left alone.'
              echo '  case "$a" in'
              echo '    -std=gnu23|-std=gnu2x) a=-std=gnu17;;'
              echo '    -std=c23|-std=c2x)     a=-std=c17;;'
              echo '  esac'
              echo '  case "$a" in -std=*) has_std=1;; esac'
              echo '  args+=("$a")'
              echo 'done'
              echo 'if [ "$compiling" = 1 ] || [ "$has_src" = 1 ]; then'
              echo '  args+=(-Wno-error=declaration-after-statement)'
              echo '  args+=(-Wno-error=incompatible-function-pointer-types)'
              echo '  args+=(-Wno-error=implicit-function-declaration)'
              echo '  args+=(-Wno-error=int-conversion)'
              if [ "$lang" = c ]; then
                echo '  [ "$has_std" = 0 ] && args+=(-std=gnu17)'
              fi
              echo 'fi'
              echo "exec \"$real\" \"\${args[@]}\""
            } > "$HOME/shim/$name"
            chmod +x "$HOME/shim/$name"
          done
          echo "--- generated shim (clang) ---"
          cat "$HOME/shim/clang"
          echo "--- self-test ---"
          "$HOME/shim/clang" --version | head -1
          echo 'char *getenv(); int main(void){return 0;}' > /tmp/t.c
          "$HOME/shim/clang" -c -force_cpusubtype_ALL -o /tmp/t.o /tmp/t.c
          "$HOME/shim/clang" -force_cpusubtype_ALL -o /tmp/t /tmp/t.o
          echo 'int main(){return 0;}' > /tmp/t.cpp
          "$HOME/shim/clang++" -c -o /tmp/tpp.o /tmp/t.cpp
          echo 'char *getenv(); int main(void){return 0;}' > /tmp/t23.c
          "$HOME/shim/clang" -c -std=gnu23 -o /tmp/t23.o /tmp/t23.c
          # mkmf's shape: compile and link together, with -Werror, including a
          # declaration C23 rejects. This is what rbs's extconf does.
          echo 'char *getenv(); int main(void){return 0;}' > /tmp/tm.c
          "$HOME/shim/clang" -Werror -std=gnu23 -o /tmp/tm /tmp/tm.c
          echo "C, C23 rewritten, mkmf-style one-step -Werror build, and C++: OK"
          echo "$HOME/shim" >> "$GITHUB_PATH"

      # Two sources are fetched ahead of the dependency build, because make
      # only clones each when its configure script is missing - so putting a
      # prepared tree in place means it adopts ours and never fetches its own.
      #
      #  libpng  takes a Classic Mac OS branch on any SDK defining
      #          TARGET_OS_MAC and tries to include <fp.h>, a header that left
      #          with Mac OS 9. Patched to fall through to math.h as intended.
      #
      #  ruby    has its bundled-gem list emptied. make install builds each
      #          one's native extension and rbs-2.7.0's does not build; none of
      #          them matter here.
      #
      #  openssl is pinned to the tag the dependency Makefile means to use.
      #          Its clone line reads:
      #
      #            git clone -q https://github.com/openssl/openssl $(DOWNLOADS)/openssl;       #            cd $(DOWNLOADS)/openssl --single-branch --branch OpenSSL_1_1_1i --depth 1
      #
      #          The branch flags are on the cd, not the clone, so it takes
      #          openssl's default branch instead of the tag. That was close
      #          enough in 2023 and is OpenSSL 4.1 now, which Ruby 3.1's
      #          bundled extension cannot build against - ASN1_STRING and
      #          friends became opaque. Cloning the intended tag is what the
      #          line was written to do.
      #
      # Both are idempotent: the download cache can hand back a prepared tree.
      - name: Pre-clone the sources the build gets wrong
        working-directory: engine/macos/Dependencies
        run: |
          for host in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "downloads/$host"

            dir="downloads/$host/libpng"
            [ -d "$dir/.git" ] || git clone -q https://github.com/mkxp-z/libpng "$dir"
            perl -pi -e 's/\s*\|\|\s*defined\(TARGET_OS_MAC\)//' "$dir/pngpriv.h"
            if grep -q 'TARGET_OS_MAC' "$dir/pngpriv.h"; then
              echo "FAILED to patch $dir/pngpriv.h"; exit 1
            fi
            echo "libpng  ready in $dir"

            # Ruby's make install builds every bundled gem's native
            # extension, and rbs-2.7.0's fails: its extconf probes the compiler
            # through mkmf, the probe does not build, and Ruby reports it as
            # missing development tools. None of the bundled gems - rbs,
            # typeprof, debug - mean anything to a game engine, and Ruby decides
            # what to install from this one file, so emptying it skips the lot
            # and takes a whole category of failure with it. The standard
            # library, which mkxp-z does use, is untouched.
            rb="downloads/$host/ruby"
            if [ ! -d "$rb/.git" ]; then
              git clone -q --single-branch -b mkxp-z-3.1.3 --depth 1                   https://github.com/mkxp-z/ruby "$rb"
            fi
            if [ -f "$rb/gems/bundled_gems" ]; then
              echo "bundled gems dropped: $(wc -l < "$rb/gems/bundled_gems")"
              : > "$rb/gems/bundled_gems"
            fi
            echo "ruby    ready in $rb"

            ssl="downloads/$host/openssl"
            if [ ! -d "$ssl/.git" ]; then
              git clone -q --depth 1 --branch OpenSSL_1_1_1i                   https://github.com/openssl/openssl "$ssl"
            fi
            echo "openssl ready in $ssl ($(cd "$ssl" && git describe --tags 2>/dev/null || echo unknown))"
          done

      - name: Build dependencies
        working-directory: engine/macos/Dependencies
        # CMake 4 removed compatibility with cmake_minimum_required(<3.5), and
        # every CMake-based dependency here predates that - physfs asks for 3.0.
        # CMake reads this as an environment variable, so one setting covers the
        # lot instead of patching each CMakeLists in turn. It is exactly what
        # CMake's own error message suggests.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: ./setup.sh

      # The engine hardcodes its game root as <bundle>/Contents/Game and chdirs
      # there before reading any config, which is why a Mac build normally
      # swallows the whole game. Pointed at the bundle's parent instead, so the
      # app sits beside Data/ and Graphics/ and reads them exactly the way the
      # Windows and Linux launchers do - one copy of the game in the repo,
      # shared by all three, rather than a second copy inside the bundle.
      - name: Read the game from beside the app, not inside it
        run: |
          f=engine/src/filesystem/filesystemImplApple.mm
          perl -pi -e 's{"Contents/Game"}{".."}' "$f"
          grep -n 'bundlePath' "$f" | head -3
          if grep -q '"Contents/Game"' "$f"; then
            echo "patch did not apply"; exit 1
          fi
          echo "game root now resolves to the bundle's parent"

      - name: Build the app
        working-directory: engine/macos
        run: |
          xcodebuild -project mkxp-z.xcodeproj \
                     -configuration Release \
                     -scheme Universal \
                     -derivedDataPath "$GITHUB_WORKSPACE/build"

      - name: Confirm it is universal
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Z-universal.app"
          BIN=$(ls "$APP/Contents/MacOS/" | head -1)
          echo "binary: $BIN"
          lipo -archs "$APP/Contents/MacOS/$BIN"

      - name: Name it and compress it
        run: |
          cd "$GITHUB_WORKSPACE/build/Build/Products/Release"
          mv Z-universal.app "Pokemon Sunday (macOS).app"
          du -sh "Pokemon Sunday (macOS).app"
          # ditto, not zip: it keeps the bundle's symlinks and permission bits,
          # and a .app that loses either does not launch.
          ditto -c -k --sequesterRsrc --keepParent \
                "Pokemon Sunday (macOS).app" "Pokemon Sunday (macOS).zip"
          ls -lh "Pokemon Sunday (macOS).zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon Sunday (macOS)
          path: build/Build/Products/Release/Pokemon Sunday (macOS).zip
          if-no-files-found: error

      # Committed from the runner because it has to be. A .app is a tree of
      # symlinks and executable bits, and checking one out on Windows turns the
      # links into text files and drops the bits, so a bundle committed from
      # there would not launch. macOS keeps both, so the machine that built it
      # is the machine that files it.
      - name: Commit the launcher to the repo
        if: ${{ github.event.inputs.publish != 'false' }}
        working-directory: game
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Pokemon Sunday (macOS).app"
          rm -rf "Pokemon Sunday (macOS).app"
          cp -a "$APP" "Pokemon Sunday (macOS).app"
          git config user.name  "macOS launcher build"
          git config user.email "actions@github.com"
          git add -A "Pokemon Sunday (macOS).app"
          if git diff --cached --quiet; then
            echo "launcher unchanged"
            exit 0
          fi
          git commit -q -m "macOS launcher, built from mkxp-z ${ENGINE_REF:0:7}"
          git pull --rebase -q
          git push
          echo "committed and pushed"
        env:
          ENGINE_REF: ${{ github.event.inputs.engine_ref || 'c9378cfaba06e0b299a1bfd4197f62da018693da' }}
